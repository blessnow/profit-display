<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>持仓与收益</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <div>
          <h1>持仓与收益</h1>
          <p class="muted">买卖按成交价调整现金；买入合并同股为加权成本</p>
        </div>
        <div class="top-actions">
          <button type="button" class="small" id="btn-refresh-kline" title="当前持仓×日K收盘+当前现金，刷新早于今日的近两周曲线（与 SNAPSHOT_HISTORY_CALENDAR_DAYS 一致）">
            日K刷新曲线
          </button>
          <button type="button" class="small" id="btn-sync-quotes">同步行情</button>
          <button type="button" class="small" id="btn-logout">退出登录</button>
        </div>
      </div>
    </header>

    <div id="login-overlay" class="login-overlay hidden">
      <form id="form-login" class="login-box">
        <h2>登录</h2>
        <p class="muted">HTTP Basic，与后端 ADMIN_USER / ADMIN_PASS 一致</p>
        <label>用户名</label>
        <input type="text" id="login-user" autocomplete="username" placeholder="holder" required />
        <label>密码</label>
        <input type="password" id="login-pass" autocomplete="current-password" required />
        <button type="submit" class="primary">进入</button>
      </form>
    </div>

    <main id="app">
      <p id="loading">加载中…</p>
      <div id="accounts" class="hidden"></div>
    </main>

    <dialog id="dlg-trade" class="panel">
      <form method="dialog" id="form-trade">
        <h2 id="trade-title">成交</h2>
        <input type="hidden" id="trade-account-id" />
        <label>方向</label>
        <select id="trade-side" required>
          <option value="buy">买入</option>
          <option value="sell">卖出</option>
        </select>
        <label>股票（拼音/代码/名称联想）</label>
        <div class="combo">
          <input
            type="text"
            id="trade-stock"
            autocomplete="off"
            required
            placeholder="如 gzmt、600519、茅台"
          />
          <input type="hidden" id="trade-stock-code" />
          <div id="trade-suggest" class="suggest-pop hidden" role="listbox"></div>
        </div>
        <label>数量（股）</label>
        <input type="number" id="trade-qty" min="1" step="1" required />
        <label>成交价</label>
        <input type="number" id="trade-price" min="0.01" step="0.001" required />
        <label>现价（仅展示；联想或加仓/减仓会带入）</label>
        <input type="text" id="trade-current" readonly inputmode="decimal" />
        <menu class="actions">
          <button type="submit" class="primary">提交</button>
          <button type="button" id="trade-cancel">取消</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dlg-edit" class="panel">
      <form method="dialog" id="form-edit">
        <h2>编辑持仓</h2>
        <input type="hidden" id="edit-holding-id" />
        <input type="hidden" id="edit-account-id" />
        <p class="muted" id="edit-stock-label"></p>
        <label>持仓数量</label>
        <input type="number" id="edit-position" min="0" step="1" required />
        <label>成本价</label>
        <input type="number" id="edit-cost" min="0" step="0.001" required />
        <label>现价（仅展示）</label>
        <input type="hidden" id="edit-current" />
        <p class="muted" id="edit-current-display" style="margin: 0 0 0.5rem"></p>
        <label>股票代码（6 位，用于自动拉行情）</label>
        <input type="text" id="edit-stock-code" placeholder="如 600519" maxlength="12" />
        <menu class="actions">
          <button type="submit" class="primary">保存</button>
          <button type="button" id="edit-cancel">取消</button>
        </menu>
      </form>
    </dialog>

    <dialog id="dlg-cash" class="panel">
      <form method="dialog" id="form-cash">
        <h2>银证资金</h2>
        <input type="hidden" id="cash-account-id" />
        <label>类型</label>
        <select id="cash-kind" required>
          <option value="deposit">入金</option>
          <option value="withdraw">出金</option>
        </select>
        <label>金额（元）</label>
        <input type="number" id="cash-amount" min="0.01" step="0.01" required />
        <label>备注</label>
        <input type="text" id="cash-note" />
        <menu class="actions">
          <button type="submit" class="primary">提交</button>
          <button type="button" id="cash-cancel">取消</button>
        </menu>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
